[package]
name = "lightcraft-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-denoise = { workspace = true, optional = true }
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
# Face networks on the GPU (`faces` module): behind the `faces` feature (M01 AI quarantine).
lightcraft-faces = { workspace = true, optional = true }
lightcraft-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:lightcraft-denoise", "lightcraft-denoise/runtime"]
# GPU accelerator for the face networks (part of the `ai` switch; see engine's `ai` feature).
faces = ["dep:lightcraft-faces"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-raw = { workspace = true }
