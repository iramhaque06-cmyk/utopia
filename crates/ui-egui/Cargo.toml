[package]
name = "lightcraft-ui-egui"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
description = "LightCraft egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
lightcraft-geom = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-catalog = { workspace = true }
web-time = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-slideshow = { workspace = true }
lightcraft-preview = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Test fixtures for the AI UI (synthetic ONNX models): pulled in only with the matching
# feature, so a default build links no ML runtime (M01 AI quarantine).
lightcraft-denoise = { workspace = true, optional = true, features = ["runtime"] }
lightcraft-faces = { workspace = true, optional = true }

[features]
# AI quarantine (M01, RULES section 2): `ai` is the switch for the model-dependent UI.
# Off by default the AI controls are hidden (not greyed out); the parts below are its pieces.
ai = ["denoise", "faces", "sam"]
denoise = ["lightcraft-engine/denoise", "dep:lightcraft-denoise"]
faces = ["lightcraft-engine/faces", "dep:lightcraft-faces"]
sam = ["lightcraft-engine/sam"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
lightcraft-codecs = { workspace = true }
lightcraft-merge = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
