[package]
name = "lightcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LightCraft command-line tool: headless render, command listing and the MCP server"

[[bin]]
name = "lightcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lightcraft-engine = { workspace = true }
lightcraft-denoise = { workspace = true }
lightcraft-sysmem = { workspace = true }
lightcraft-mcp = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-merge = { workspace = true }
serde_json = { workspace = true }
dhat = { workspace = true, optional = true }

[features]
# Phase 1 (RULES section 2): no AI in the default build. `ai` turns every model-dependent feature
# on (AI denoise, SAM 3 masks, face detection/recognition); off by default, no ML runtime is
# linked and no model weights are downloaded.
default = []
ai = ["denoise", "sam", "faces", "lightcraft-ui-egui/ai"]
denoise = ["lightcraft-engine/denoise"]
sam = ["lightcraft-engine/sam"]
faces = ["lightcraft-engine/faces"]
rawnind-model = ["denoise", "lightcraft-engine/rawnind-model"]
# Heap profiling: `cargo run --release -p lightcraft-cli --features dhat-heap -- snapshot …` counts
# every allocation (live/peak bytes in `library.memory` / `ui.inspect`) and writes dhat-heap.json
# (open it in DHAT's viewer: allocation sites by bytes at the peak). Slows allocation-heavy work.
dhat-heap = ["dep:dhat"]

# Open HEIC/HEIF photos (the optional lightcraft-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it.
heif = ["lightcraft-codecs/heif"]
